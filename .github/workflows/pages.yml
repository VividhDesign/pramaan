# Builds the in-browser checker and publishes it to the gh-pages branch, which
# GitHub Pages serves at https://vividhdesign.github.io/pramaan/. Runs on every
# push to main and every Monday, so new Supreme Court judgments appear without a
# code change. gh-pages is overwritten with a single commit each time, so the
# weekly index does not pile up in history.
name: Deploy site
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[sync]"
      - run: pramaan --db idx/sc.sqlite sync
      - run: python web/build_site.py --db idx/sc.sqlite --out site
      - name: Publish to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish site from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
